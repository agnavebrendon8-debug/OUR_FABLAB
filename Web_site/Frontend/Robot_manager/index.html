
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Arm - Three.js</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #0b1120;
      color: #e5edf7;
      font-family: Arial, sans-serif;
    }

    #scene { position: fixed; inset: 0; }

    #panel {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 300px;
      padding: 20px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
    }

    h2 { margin: 0 0 8px; font-size: 20px; }
    .muted { color: #94a3b8; font-size: 12px; }

    #status {
      margin: 15px 0;
      font-size: 13px;
    }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 8px;
    }

    .joint { margin: 15px 0; }
    .joint label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input[type=range] { width: 100%; accent-color: #38bdf8; }

    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 7px;
      background: #0284c7;
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }

    button.secondary { background: #334155; }

    #hint {
      position: absolute;
      bottom: 18px;
      right: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(15,23,42,.85);
      color: #cbd5e1;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="scene"></div>

  <div id="panel">
    <h2>ROBOT CONTROL</h2>
    <div class="muted">THREE.JS · REAL-TIME TELEMETRY</div>

    <div id="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Connexion...</span>
    </div>

    <div id="sliders"></div>

    <button id="reset">Réinitialiser les axes</button>
    <button class="secondary" id="reconnect">Reconnecter WebSocket</button>

    <p class="muted">
      Glisse les curseurs pour tester les articulations.
      Les messages reçus du serveur mettent à jour le modèle.
    </p>
  </div>

  <div id="hint">
    Clic gauche : rotation caméra · Molette : zoom · Clic droit : déplacement
  </div>

  <script src="scripts_rb.js" type="module"> </script>
</body>
</html>
